
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Grid Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Nested Grid</h1>

    <div class="main-grid">

        <div class="box">Main Box 1</div>

        <div class="box nested-grid">

            <div class="small-box">Box A</div>
            <div class="small-box">Box B</div>
            <div class="small-box">Box C</div>
            <div class="small-box">Box D</div>

        </div>

        <div class="box">Main Box 3</div>

    </div>

</body>
